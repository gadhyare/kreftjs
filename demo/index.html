<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- the folder this app lives in: the router and the .kreft paths start from here -->
  <base href="/demo/">
  <title>Kreft Demo</title>
  <link rel="icon" type="image/svg+xml" href="logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap">
  <!-- the look: quiet, like shadcn/ui, with square corners and no shadows -->
  <link rel="stylesheet" href="ui.css">
  <style>
    /* page changes: <kreft-view k-animate.after="page"> */
    .page-out { transition: opacity .12s ease; }
    .page-out-to { opacity: 0; }
    .page-in { transition: opacity .18s ease, transform .18s ease; }
    .page-in-from { opacity: 0; transform: translateY(4px); }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="../kreftjs.js"></script>
  <script>
    // 1) Shared stores — every component can read and change them
    Kreftjs.store('cart', {
      items: [],
      get count() { return this.items.length },
      get total() { return this.items.reduce((sum, p) => sum + p.price, 0) },
      add(product) {
        this.items.push(product)
        Kreftjs.bus.send('toast', product.name + ' added to cart')
      },
      remove(index) { this.items.splice(index, 1) },
    }, { saved: true }) // the cart survives a reload

    Kreftjs.store('users', {
      list: [
        { id: 1, name: 'Maxamuud Cali', city: 'Hargeisa', role: 'Developer' },
        { id: 2, name: 'Maxamuud Xussen', city: 'Mogadishu', role: 'Designer' },
        { id: 3, name: 'Cabdi Yuusuf', city: 'Berbera', role: 'Manager' },
      ],
      find(id) { return this.list.find((u) => u.id == id) },
    })

    // 2) Routes — each page is a .kreft file, shown inside a layout (layouts/*.kreft)
    const router = Kreftjs.router({
      layout: 'main',       // every page: layouts/main.kreft (menu on the left)…
      errors: 'errors',     // error pages: errors/404.kreft for unknown addresses, abort(403) → errors/403.kreft
      routes: [
        // Basics
        { path: '/', component: 'pages/Start.kreft', meta: { title: 'Kreft · components in plain words' } },
        // …unless a route names another one (Start.kreft says `layout plain` itself)
        { path: '/docs', component: '../docs/Docs.kreft', layout: 'plain', meta: { title: 'Documentation · Kreft' } },
        { path: '/basics', component: 'pages/Home.kreft', meta: { title: 'Basics · Kreft' } },
        { path: '/lifecycle', component: 'pages/Lifecycle.kreft', meta: { title: 'Lifecycle · Kreft' } },
        // Views
        { path: '/loops', component: 'pages/Loops.kreft', meta: { title: 'Loops · Kreft' } },
        { path: '/forms', component: 'pages/Forms.kreft', meta: { title: 'Forms · Kreft' } },
        { path: '/directives', component: 'pages/Directives.kreft', meta: { title: 'Directives · Kreft' } },
        { path: '/animations', component: 'pages/Animations.kreft', meta: { title: 'Animations · Kreft' } },
        { path: '/fast', component: 'pages/Fast.kreft', meta: { title: 'Fast views · Kreft' } },
        { path: '/layouts', component: 'pages/Layouts.kreft', meta: { title: 'Layouts · Kreft' } },
        { path: '/print', component: 'pages/Print.kreft', layout: false, meta: { title: 'Print · Kreft' } },
        // Components
        { path: '/components', component: 'pages/Components.kreft', meta: { title: 'Components · Kreft' } },
        { path: '/keep', component: 'pages/KeepWait.kreft', meta: { title: 'Keep and wait · Kreft' } },
        // Data
        { path: '/saved', component: 'pages/Saved.kreft', meta: { title: 'Saved data · Kreft' } },
        { path: '/sharing', component: 'pages/Sharing.kreft', meta: { title: 'Sharing · Kreft' } },
        { path: '/shop', component: 'pages/Shop.kreft', meta: { title: 'Shop · Kreft' } },
        { path: '/posts', component: 'pages/Posts.kreft', meta: { title: 'Posts · Kreft' } },
        { path: '/logic', component: 'pages/Logic.kreft', meta: { title: 'Shared logic · Kreft' } },
        { path: '/online', component: 'pages/Online.kreft', meta: { title: 'Online API · Kreft' } },
        { path: '/database', component: 'pages/Database.kreft', meta: { title: 'Database · Kreft' } },
        { path: '/backend', component: 'pages/Backend.kreft', meta: { title: 'Backend · Kreft' } },
        { path: '/server', component: 'pages/Server.kreft', meta: { title: 'Server code · Kreft' } },
        // Router
        { path: '/users', component: 'pages/Users.kreft', meta: { title: 'Users · Kreft' } },
        { path: '/users/:id', name: 'user', component: 'pages/User.kreft', props: true },
        { path: '/router', component: 'pages/Router.kreft', meta: { title: 'Router · Kreft' } },
        { path: '/secret', component: 'pages/Router.kreft', guard: () => '/router?blocked=1' },
        { path: '/old-page', redirect: '/router?from=old-page' },
        // nested routes: Settings is the frame, its own <kreft-view> shows the child
        { path: '/settings', component: 'pages/Settings.kreft', meta: { title: 'Settings · Kreft', area: 'settings' }, children: [
          { path: '', component: 'pages/settings/General.kreft' },
          { path: 'account', component: 'pages/settings/Account.kreft', meta: { title: 'Account · Kreft' } },
          { path: 'look', component: 'pages/settings/Look.kreft', meta: { title: 'Look · Kreft' } },
        ] },
        // Tools
        { path: '/security', component: 'pages/Security.kreft', meta: { title: 'HTML Security · Kreft' } },
        { path: '/error-monitor', component: 'pages/ErrorMonitor.kreft', meta: { title: 'Error Monitor · Kreft' } },
        { path: '/render', component: 'pages/Render.kreft', meta: { title: 'Template engine · Kreft' } },
        { path: '/playground', component: 'pages/Playground.kreft', meta: { title: 'Playground · Kreft' } },
        { path: '/tools', component: 'pages/Tools.kreft', meta: { title: 'Dev tools · Kreft' } },
      ],
    })

    // 3) The app itself is a .kreft file too
    Kreftjs.app('App.kreft')
      .component('SiteHeader', 'components/SiteHeader.kreft') // the bar both layouts use
      .component('Counter', 'components/Counter.kreft')
      .component('TodoList', 'components/TodoList.kreft')
      // a custom directive: <input k-focus> gets the focus when it appears
      .directive('focus', { ready(el) { el.focus() } })
      .use(router)
      .mount('#app')
  </script>
</body>
</html>
