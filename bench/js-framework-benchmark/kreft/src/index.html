<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kreft-"keyed"</title>
  <link href="/css/currentStyle.css" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script src="kreftjs.js"></script>
  <script>
    // test data, like every implementation of the benchmark
    const A = ['pretty','large','big','small','tall','short','long','handsome','plain','quaint','clean','elegant','easy','angry','crazy','helpful','mushy','odd','unsightly','adorable','important','inexpensive','cheap','expensive','fancy']
    const C = ['red','yellow','blue','green','pink','brown','purple','brown','white','black','orange']
    const N = ['table','chair','house','bbq','desk','car','pony','cookie','sandwich','burger','pizza','mouse','keyboard']
    let nextId = 1
    const rnd = (max) => Math.round(Math.random() * 1000) % max
    window.buildData = (count) => {
      const data = new Array(count)
      for (let i = 0; i < count; i++) data[i] = { id: nextId++, label: A[rnd(A.length)] + ' ' + C[rnd(C.length)] + ' ' + N[rnd(N.length)] }
      return data
    }
    Kreftjs.app('App.kreft').mount('#app')
  </script>
</body>
</html>
