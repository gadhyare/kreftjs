name = "Kreft"
grammar = "html"
path_suffixes = ["kreft", "kreftjs"]
block_comment = ["<!-- ", " -->"]
autoclose_before = ">})]"
brackets = [
  { start = "<", end = ">", close = true, newline = true },
  { start = "{", end = "}", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
  { start = "<!--", end = " -->", close = true, newline = false, not_in = ["comment", "string"] },
]
word_characters = ["-", "$"]
tab_size = 2
prettier_parser_name = "html"
